<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Stock Ticker</title>
    <meta content="mode:cors" name="htmx-config">

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/ext/hx-sse.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            padding: .5rem 1rem;
            border: 1px solid #ccc;
        }

        .up {
            background: #d4f5dd;
            color: #137a3d;
        }

        .down {
            background: #fbdcdc;
            color: #b42318;
        }
    </style>
</head>
<body>
<h1>Stock Prices</h1>
<table hx-sse:connect="http://localhost:8080/stocks">
    <thead>
    <tr>
        <th>Symbol</th>
        <th>Company</th>
        <th>Price</th>
        <th>Change</th>
    </tr>
    </thead>
    <tbody>
    <tr id="company-GOOG"></tr>
    <tr id="company-AAPL"></tr>
    <tr id="company-MSFT"></tr>
    </tbody>
</table>
</body>
</html>
